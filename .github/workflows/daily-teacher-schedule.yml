name: Daily Teacher Schedule Notification

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get Cairo date
        id: cairo_date
        run: echo "day=$(TZ=Africa/Cairo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily notification marker
        id: daily_marker
        uses: actions/cache@v4
        with:
          path: .notify_state
          key: teacher-schedule-state-${{ steps.cairo_date.outputs.day }}

      - name: Send today's schedule to Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, re, requests
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html import escape

          TZ = ZoneInfo("Africa/Cairo")
          DEFAULT_ZOOM = "https://us05web.zoom.us/j/83526892910?pwd=2jWRgATgBRPbXttdnm0QpLwBApsZL4.1"
          # رابط Supabase عام، لذلك نثبته هنا حتى لا يفشل الـWorkflow بسبب Secret الرابط.
          supabase = "https://rcxfmrsqknzxjxnmobes.supabase.co"
          key = (os.environ.get("SUPABASE_KEY") or os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or os.environ.get("SUPABASE_ANON_KEY") or "").strip()
          bot = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          chat = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          missing = []
          if not key: missing.append("SUPABASE_KEY")
          if not bot: missing.append("TELEGRAM_BOT_TOKEN")
          if not chat: missing.append("TELEGRAM_CHAT_ID")
          if missing:
              raise RuntimeError("Missing GitHub Secrets: " + ", ".join(missing) + ". Add them in Settings → Secrets and variables → Actions.")
          headers = {"apikey": key, "Authorization": "Bearer " + key}

          telegram_test = requests.get(
              "https://api.telegram.org/bot" + bot + "/getMe",
              timeout=20
          )
          print("Telegram getMe HTTP:", telegram_test.status_code)
          if telegram_test.status_code != 200:
              print("Telegram getMe response:", telegram_test.text[:1000])
              raise RuntimeError(
                  "Telegram getMe failed: HTTP " + str(telegram_test.status_code)
                  + " | " + telegram_test.text[:1000]
              )
          try:
              telegram_test_json = telegram_test.json()
          except Exception:
              print("Telegram getMe non-JSON response:", telegram_test.text[:1000])
              raise RuntimeError("Telegram getMe returned a non-JSON response")
          if not telegram_test_json.get("ok"):
              raise RuntimeError(
                  "Telegram bot authentication failed: "
                  + str(telegram_test_json)[:1000]
              )

          def clean(v):
              s = str(v or "").strip()
              return "" if s.lower() in ("nan","none","null") else s

          def parse_time(v):
              s = clean(v).replace("٫", ":").replace("：", ":")
              for fmt in ("%H:%M","%H.%M","%H:%M:%S"):
                  try: return datetime.strptime(s[:8], fmt).time()
                  except: pass
              s = (s.upper().replace("صباحًا","AM").replace("صباحا","AM").replace("ص","AM")
                     .replace("مساءً","PM").replace("مساء","PM").replace("م","PM"))
              for fmt in ("%I:%M %p","%I.%M %p","%I %p"):
                  try: return datetime.strptime(s, fmt).time()
                  except: pass
              return None

          def first(row, keys):
              for k in keys:
                  v = clean(row.get(k, ""))
                  if v: return v
              return ""

          def send(msg):
              try:
                  r = requests.post(
                      "https://api.telegram.org/bot" + bot + "/sendMessage",
                      data={"chat_id": chat, "text": msg, "parse_mode": "HTML",
                            "disable_web_page_preview": False},
                      timeout=30)
              except requests.RequestException as ex:
                  raise RuntimeError("Telegram network error: " + str(ex))
              print("Telegram sendMessage HTTP:", r.status_code)
              print("Telegram sendMessage response:", r.text[:1000])
              if r.status_code != 200:
                  raise RuntimeError(
                      "Telegram sendMessage failed: HTTP " + str(r.status_code)
                      + " | " + r.text[:1000]
                  )
              try:
                  result = r.json()
              except Exception:
                  raise RuntimeError("Telegram sendMessage returned non-JSON response")
              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram sendMessage failed: " + str(result)[:1000]
                  )

          schedule_response = requests.get(
              supabase + "/rest/v1/weekly_schedule",
              headers=headers, params={"select":"*","limit":"1000"}, timeout=30)
          print("Supabase status:", schedule_response.status_code)
          schedule_response.raise_for_status()
          data = schedule_response.json()

          now = datetime.now(TZ).replace(second=0, microsecond=0)
          days = ["الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت","الأحد"]
          today = days[now.weekday()]
          rows = []

          for row in data:
              if clean(row.get("اليوم")) != today:
                  continue
              if clean(row.get("حالة الموعد")) in ("متوقف","ملغي","ملغاة","موقوف"):
                  continue
              t = parse_time(row.get("الموعد"))
              if not t:
                  continue
              row["_dt"] = datetime(now.year, now.month, now.day, t.hour, t.minute, tzinfo=TZ)
              rows.append(row)

          rows.sort(key=lambda x: x["_dt"])

          # 07:00 صباحًا: ملخص اليوم.
          # نستخدم نافذة أوسع لأن GitHub قد يؤخر scheduled workflows وقت الضغط.
          state_path = ".notify_state"
          sent = set()
          if os.path.exists(state_path):
              try:
                  sent = set(x.strip() for x in open(state_path, encoding="utf-8") if x.strip())
              except Exception:
                  sent = set()
          day_key = now.strftime("%Y-%m-%d")
          summary_key = "summary:" + day_key
          if now.hour == 7 and now.minute <= 15 and summary_key not in sent:
              if not rows:
                  send("🌅 <b>صباح الخير يا بشمهندس 👋</b>\n📅 <b>" + escape(today) +
                       "</b>\n\nلا توجد حصص مسجلة اليوم.")
              else:
                  lines = ["🌅 <b>صباح الخير يا بشمهندس 👋</b>",
                           "📅 <b>حصص اليوم — " + escape(today) + "</b>", ""]
                  for row in rows:
                      tm = row["_dt"].strftime("%I:%M %p").lstrip("0")
                      student = escape(clean(row.get("اسم الطالب")) or "غير محدد")
                      grade = escape(clean(row.get("المجموعة/الصف")))
                      academy = escape(clean(row.get("اسم الأكاديمية")))
                      line = "🕐 <b>" + tm + "</b> — 👤 " + student
                      if grade: line += " — 🎓 " + grade
                      if academy: line += " — 🏫 " + academy
                      lines.append(line)
                  lines += ["", "📌 إجمالي حصص اليوم: <b>" + str(len(rows)) + "</b>"]
                  send("\n".join(lines))
              sent.add(summary_key)
              open(state_path, "w", encoding="utf-8").write("\n".join(sorted(sent)) + "\n")

          # قبل الحصة بـ10 دقائق، وعند بداية الحصة
          for row in rows:
              delta = (row["_dt"] - now).total_seconds() / 60
              student = escape(clean(row.get("اسم الطالب")) or "غير محدد")
              grade = escape(clean(row.get("المجموعة/الصف")) or "غير محدد")
              academy = escape(clean(row.get("اسم الأكاديمية")) or "غير محددة")
              tm = row["_dt"].strftime("%I:%M %p").lstrip("0")
              zoom = first(row, ["رابط زووم","رابط Zoom","Zoom","zoom_link","zoom","لينك زووم","رابط الحصة"]) or DEFAULT_ZOOM
              link = escape(zoom, quote=True)

              class_key = row["_dt"].strftime("%Y-%m-%d %H:%M") + ":" + clean(row.get("اسم الطالب"))
              pre_key = "pre:" + class_key
              start_key = "start:" + class_key
              if 6.5 <= delta <= 12.5 and pre_key not in sent:
                  send("⏳ <b>استعد للحصة بعد 10 دقائق</b>\n\n"
                       "👤 <b>الطالب:</b> " + student + "\n"
                       "🎓 <b>الصف:</b> " + grade + "\n"
                       "🏫 <b>الأكاديمية:</b> " + academy + "\n"
                       "🕐 <b>الموعد:</b> " + tm + "\n\n"
                       "🔗 <a href=\"" + link + "\">دخول حصة Zoom</a>\n<code>" +
                       escape(zoom) + "</code>")
                  sent.add(pre_key)
                  open(state_path, "w", encoding="utf-8").write("\n".join(sorted(sent)) + "\n")
              elif -5 <= delta < 2.5 and start_key not in sent:
                  send("🚨 <b>حان الآن موعد الحصة</b> 🔔\n\n"
                       "👤 <b>الطالب:</b> " + student + "\n"
                       "🎓 <b>الصف:</b> " + grade + "\n"
                       "🏫 <b>الأكاديمية:</b> " + academy + "\n"
                       "🕐 <b>الموعد:</b> " + tm + "\n\n"
                       "🔗 <a href=\"" + link + "\">دخول حصة Zoom الآن</a>\n<code>" +
                       escape(zoom) + "</code>")
                  sent.add(start_key)
                  open(state_path, "w", encoding="utf-8").write("\n".join(sorted(sent)) + "\n")

          print("Notification check completed:", now.isoformat(), "today:", today, "classes:", len(rows))
          PY
