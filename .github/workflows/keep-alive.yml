name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit Streamlit app
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "STREAMLIT_APP_URL secret is missing."
            exit 1
          fi
          curl -L --fail --silent --show-error --max-time 60 "$APP_URL" -o /dev/null
          echo "Keep-alive request completed."
